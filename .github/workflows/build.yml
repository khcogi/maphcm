name: build-node24

run-name: build-node24 • ${{ github.ref_name }} • ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Show runtime info
        run: |
          echo "Workflow: build-node24"
          echo "Node version:" $(node -v)
          echo "NPM version:" $(npm -v)
          echo "Ref:" ${{ github.ref }}
          echo "SHA:" ${{ github.sha }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build
